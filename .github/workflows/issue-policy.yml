# Fork-local: this workflow only runs manually here.
# .github/issue-management/config.json hardcodes organization "deepseek-harness"
# and a GitHub Project (projectNumber 1, its own custom fields and statuses)
# that only exists upstream; this fork has neither. See
# .agents/notes/implemented/process/2026-08-16-fork-ci-trim.md
name: Issue policy

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
