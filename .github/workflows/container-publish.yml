name: Container image

# Build the dsh web container and publish it to this repository's GHCR
# namespace (ghcr.io/<owner>/deepseek-harness).
#
#   master push / manual dispatch  -> :latest, :sha-<short>
#   dsh-v* tag push                -> :<version> (dsh-v0.1.0-rc.5 -> 0.1.0-rc.5), :latest
#
# Authentication is the repo-scoped GITHUB_TOKEN (packages: write) — no PAT or
# secrets are needed. The image is built from THIS repository's exact commit via
# the Containerfile REPO_URL/REPO_REF build args, never from upstream HEAD.

on:
  push:
    branches: [master]
    tags: ['dsh-v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/dsh-v') }}
            type=match,pattern=dsh-v(.*),group=1
            type=sha,prefix=sha-,format=short,enable=${{ startsWith(github.ref, 'refs/heads/master') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REPO_URL=https://github.com/${{ github.repository }}.git
            REPO_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
