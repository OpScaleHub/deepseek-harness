name: Nightly image sync

# The only workflow in this repository, and it has no pull_request or push
# trigger: nothing here ever runs against a PR or an ordinary commit.
# Once nightly (03:17 UTC) plus manual dispatch, it checks
# deepseek-ai/deepseek-harness (upstream) for its current master commit; if
# that commit isn't already published, it builds an image straight from it
# and pushes ghcr.io/<owner>/deepseek-harness:latest and :sha-<short>.
#
# This fork's own master is never merged with upstream and plays no part in
# the build: REPO_URL/REPO_REF point straight at upstream's commit, so the
# published image always tracks upstream directly. Only the Containerfile
# and container/web-bind-all.patch.yml, checked out from this repo, shape
# the build.
#
# Authentication is the repo-scoped GITHUB_TOKEN (packages: write) — no PAT
# or secrets needed.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_URL: https://github.com/deepseek-ai/deepseek-harness.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve upstream commit
        id: upstream
        run: |
          full=$(git ls-remote "$UPSTREAM_URL" refs/heads/master | cut -f1)
          echo "sha=$full" >> "$GITHUB_OUTPUT"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this upstream commit is already published
        id: check
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:sha-${{ steps.upstream.outputs.short }}" >/dev/null 2>&1; then
            echo "already published, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.upstream.outputs.short }}
          build-args: |
            REPO_URL=${{ env.UPSTREAM_URL }}
            REPO_REF=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
